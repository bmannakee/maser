# The config the UI scenarios run with. scripts/check-ui fills in the fake gh's path.
#
# The searches pick recorded PRs in bmannakee/maser: changing them means re-recording (see README.md).

[github]
gh = "@FAKE_GH@"

[queue]
sections = []
searches = [
    { name = "Merged", query = "repo:bmannakee/maser is:merged" },
    { name = "Closed", query = "repo:bmannakee/maser is:closed is:unmerged" },
]
